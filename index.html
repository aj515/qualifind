<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
  <title>QualiFind | AI-Powered Student Assistance Navigator Philippines</title>

  <!-- Theme check before first paint -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("qualifind_theme");
        var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        var isDark = saved ? saved === "dark" : prefersDark;
        if (isDark) document.documentElement.classList.add("dark");
      } catch (e) {}
    })();
  </script>
  <meta name="description" content="QualiFind - AI-Powered Student Assistance Navigator in the Philippine Higher Education Setting."/>

  <!-- Google Fonts: Outfit (Headings) & Plus Jakarta Sans (Body) & Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,600,0,0&display=swap" rel="stylesheet"/>
</head>
<body class="bg-paper font-sans text-ink antialiased bg-dot-grid min-h-screen">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
